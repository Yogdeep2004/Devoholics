[project]
name = "devoholics-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4",
  "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2", "httpx>=0.27", "structlog>=24.1", "pyjwt[crypto]>=2.9",
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
