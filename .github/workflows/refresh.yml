name: Refresh ecosystem data
on:
  schedule: [{ cron: "17 3 * * *" }]   # daily snapshot; growth metrics need one point per day
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e .
      - run: alembic upgrade head
      - run: python -m app.cli refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}   # secret names can't start with GITHUB_
