name: Refresh ecosystem data
on:
  schedule: [{ cron: "17 3 * * *" }]   # daily snapshot; growth metrics need one point per day
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Check required secrets
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::Missing repository secret DATABASE_URL"; exit 1; }
          [ -n "$GITHUB_TOKEN" ] || { echo "::error::Missing repository secret GH_API_TOKEN"; exit 1; }
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
      - run: pip install -e .
      - run: alembic upgrade head
      - name: Security check (every public table must have RLS)
        run: python -m app.cli security-check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m app.cli refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}   # secret names can't start with GITHUB_
